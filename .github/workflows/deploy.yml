name: deploy

# Branch-bound CD per std-21: merge to `develop` deploys int; merge to `main`
# deploys prod. Both protected branches only take merges from PRs whose `test`
# + `e2e` checks are green, so a push event here is by construction a reviewed,
# CI-passing change. Prod deploys run unattended on merge to `main` — merging
# the develop→main PR IS the decision to ship (the prod environment's
# required-reviewer gate was removed 2026-06-05).
#
# The deploy itself is the SAME ./deploy.sh a human runs locally (server
# migrations + Cloud Run, UI build + GCS + CDN, then the std-17 smoke tail
# against the live host — a red smoke fails the job loudly).
#
# Auth is keyless: google-github-actions/auth mints short-lived GCP credentials
# via Workload Identity Federation (see scripts/setup-github-deployer.sh). The
# `github-deployer` service account holds standing deploy roles — a recorded
# exception to the humans-use-PAM posture in scripts/deploy-config.sh.
#
# Per-env config: the CANONICAL source is the Secret Manager secret
# `memex-<env>-deploy-env`, fetched by scripts/deploy-config.sh on every deploy
# (DEPLOY_CONFIG_SOURCE / DEPLOY_CONFIG_PROJECT on the deploy step below).
#
# This header used to read "CI and laptops share one config mechanism, zero
# drift." That sentence was wrong in a way that cost an outage, and it is worth
# keeping the correction visible: CI and laptops shared a config FILE while
# obeying different SOURCES. Writing scripts/deploy.<env>.env made
# deploy-config.sh take its local-override branch — documented "ad-hoc testing
# only" — so the canonical secret was never read in production. It already held
# MAX_INSTANCES=8 while prod kept deploying at 3 (spec-518 dec-4).
#
# The DEPLOY_ENV_FILE blob is now a stale snapshot kept for one rollout so the
# switch can be reverted in a line; it is retired in spec-518 ac-17.

on:
  push:
    branches: [develop, main]
  # Manual redeploy of either env from the Actions tab (e.g. after a config
  # change or to roll the same SHA again). Uses the same branch→env mapping.
  workflow_dispatch:

# One deploy at a time per branch; never cancel a mid-flight deploy (a killed
# deploy can leave migrations applied with the old revision still serving).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation
  actions: read # spec-395: the `gate` job reads the test/deploy workflow runs for the SHA

jobs:
  # spec-395 (workstream F, dec-1/dec-2): the DEPLOY GATE — fail-closed.
  #
  # Before this, deploy.yml triggered on `push` with NO dependency on `test`, so the
  # deploy ran CONCURRENTLY with the tests and a non-PR push or misconfig could ship
  # a revision whose tests were red, absent, or still running. This job blocks the
  # deploy until the `test` workflow concluded SUCCESS for THIS exact commit SHA.
  #
  # Why a guard JOB, not a `workflow_run` trigger (dec-1): the `deploy` job below
  # selects int-vs-prod entirely from `github.ref_name` (environment, ENV, the
  # env-scoped DEPLOY_ENV_FILE secret) and its concurrency keys off `github.ref`. A
  # `workflow_run` trigger rewrites ref/ref_name to the default branch — which would
  # silently ship a prod (main) deploy on INT config + secrets. So the trigger stays
  # `push`, the deploy job is untouched, and this gate is purely additive.
  #
  # For a PROD deploy (ref_name == main) the gate ALSO checks the int (develop)
  # `deploy` run for the SHA — a green int deploy run ≡ int smoke passed for the SHA,
  # since smoke runs inline at deploy.sh's tail (std-26) and `main` FF's the identical
  # develop SHA (std-21). That int-smoke check ships in WARN mode (INT_SMOKE_ENFORCE
  # below): it reports but does NOT block, because a break-glass int deploy leaves no
  # CI run for the SHA and a hard block would wedge a legitimate prod deploy. Flip to
  # `block` only after validating the live semantics (spec-395 dec-2 — flagged to the
  # orchestrator). The gate logic + its fail-closed branches are unit-tested in
  # packages/server/src/__regression__/deploy-gate.regression.test.ts.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # bounded — the script polls then fails closed within this
    # Least-privilege: this job only READS workflow runs; no GCP, no checkout-of-secrets.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Gate the deploy on green tests for the SHA (+ int-smoke for prod, WARN)
        env:
          GH_TOKEN: ${{ github.token }}
          # dec-2 flip knob: 'warn' (default — reports, never blocks prod) | 'block'
          # (hard prod gate). Leave 'warn' until the live break-glass/dispatch/timeout
          # semantics are validated; flipping to 'block' is the only change needed.
          INT_SMOKE_ENFORCE: warn
        run: node scripts/ci/deploy-gate.mjs

  deploy:
    needs: [gate] # spec-395: the gate must pass before any GCP mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'int' }}
      url: ${{ github.ref_name == 'main' && 'https://memex.ai' || 'https://int.memex.ai' }}

    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'int' }}

    steps:
      - uses: actions/checkout@v7

      # No `version:` here — pnpm/action-setup@v6 reads the pinned version from
      # the root package.json `packageManager` field and errors if both are set.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install cloud-sql-proxy
        # packages/server/deploy.sh runs migrations through a local proxy
        # (PROXY_PORT=15432) before cutting Cloud Run traffic over.
        run: |
          curl -fsSL -o /usr/local/bin/cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Write per-env deploy config
        # The gitignored scripts/deploy.<env>.env, exactly as a deployer's
        # laptop has it (DB_PASS is fetched from Secret Manager at source
        # time, so the secret holds coordinates, not credentials).
        #
        # spec-518 dec-4: this file is NO LONGER what the deploy reads. Writing it
        # made deploy-config.sh take its LOCAL-OVERRIDE branch — documented "ad-hoc
        # testing only" — on every CI deploy, so the canonical secret was never
        # fetched in production. The step is kept for one rollout only, so the
        # switch below can be reverted in one line; it is retired once both
        # environments have deployed clean from the canonical secret (ac-17).
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          if [ -z "$DEPLOY_ENV_FILE" ]; then
            echo "::error::DEPLOY_ENV_FILE secret is not set on the '${ENV}' environment"
            exit 1
          fi
          printf '%s\n' "$DEPLOY_ENV_FILE" > "scripts/deploy.${ENV}.env"

      - name: Deploy (server + UI + smoke)
        # SMOKE_MCP_TOKEN + SMOKE_SESSION_TOKEN enable the authed write tier of
        # the smoke suite (b-70 t-8 / spec-156 ac-13): mxt_ drives /mcp writes,
        # the session JWT holds the SSE stream open (sessionMiddleware is
        # JWT-only). Both are environment secrets minted by
        # `tsx src/db/seed-smoke.ts`; the suite skips that tier cleanly when
        # either is unset. The session token expires (~180d) — re-run the seed
        # script to rotate.
        # MEMEX_EMIT_KEY lets the smoke suite's tagAc() emissions land on the
        # prod memex (spec-156 ac-12/ac-13: the live relay-health + MCP→SSE
        # checks verify their ACs on every deploy). Without it the smoke still
        # runs — emissions are just silently rejected 401.
        env:
          # spec-518 dec-4 / t-6 — obey the CANONICAL config source.
          #
          # deploy-config.sh (spec-168) defines `memex-<env>-deploy-env` in Secret
          # Manager as canonical, and a PRESENT scripts/deploy.<env>.env as an opt-in
          # override for "ad-hoc testing only". The step above writes that file on every
          # CI run, so every deploy silently took the override branch and the canonical
          # secret was NEVER read in production. It already held the right values —
          # MAX_INSTANCES=8, MIN_INSTANCES=1, DB_POOL_MAX=4 — while prod deployed at the
          # 3-instance ceiling and shed 2000+ requests on 2026-08-11.
          #
          # These two lines are the whole fix. DEPLOY_CONFIG_PROJECT was referenced only
          # INSIDE deploy-config.sh and supplied nowhere, so the canonical branch had
          # never executed in CI even once — it would have aborted on the missing
          # pointer. The fetch fails closed: an unreadable secret stops the deploy loudly
          # rather than shipping stale config. github-deployer holds
          # roles/secretmanager.secretAccessor at project level in both projects.
          DEPLOY_CONFIG_SOURCE: secret
          DEPLOY_CONFIG_PROJECT: memex-ai-${{ github.ref_name == 'main' && 'prod' || 'int' }}
          SMOKE_MCP_TOKEN: ${{ secrets.SMOKE_MCP_TOKEN }}
          SMOKE_SESSION_TOKEN: ${{ secrets.SMOKE_SESSION_TOKEN }}
          MEMEX_EMIT_KEY: ${{ secrets.MEMEX_EMIT_KEY }}
          # spec-428 dec-1/dec-3 — team-identity sender for the welcome + spec-427 drip.
          # Non-sensitive brand copy, so kept as per-environment VARIABLES (not in the
          # DEPLOY_ENV_FILE secret blob). deploy.sh pushes them to Cloud Run via its
          # optional ${VAR+...} wiring, so an unset variable is simply omitted.
          EMAIL_ACTIVATION_FROM: ${{ vars.EMAIL_ACTIVATION_FROM }}
          EMAIL_ACTIVATION_REPLY_TO: ${{ vars.EMAIL_ACTIVATION_REPLY_TO }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME }}
          # spec-427 dec-9 — the activation-drip master/kill switch. Non-sensitive
          # (0/1), so a per-environment VARIABLE like the sender vars above (not in the
          # DEPLOY_ENV_FILE blob), enabling a by-hand prod flip + kill from the GitHub
          # environment UI. deploy.sh wires it to Cloud Run only when set (${VAR+...}),
          # so an unset/absent variable is omitted and the drip stays OFF by default.
          ACTIVATION_EMAILS_ENABLED: ${{ vars.ACTIVATION_EMAILS_ENABLED }}
        run: bash deploy.sh

      # spec-243 dec-2 / ac-6: every deploy posts a friendly note to the matching
      # env's Slack channel (#memex-prod-alerts / #memex-int-alerts), so each
      # channel is the single timeline of "what changed and what broke" for its
      # environment. Enriched with the specs + PRs that shipped (Option B —
      # clickable spec links derived from the commit list, zero API calls so a
      # Memex outage can never slow or break this). Friendly on success, a short
      # red line if the deploy job itself failed; never fails the deploy.
      - name: Notify Slack (deploy)
        if: always()
        env:
          SLACK_WEBHOOK: ${{ env.ENV == 'prod' && secrets.SLACK_WEBHOOK_PROD || secrets.SLACK_WEBHOOK_INT }}
          HOST: ${{ env.ENV == 'prod' && 'memex.ai' || 'int.memex.ai' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: node scripts/canary/deploy-notify.mjs
